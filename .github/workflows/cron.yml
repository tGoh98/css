name: Cron

# Drives the Vercel cron endpoints from GitHub Actions. We use GH Actions
# instead of Vercel Cron because Vercel Hobby caps cron frequency at daily,
# and we split per-source to stay under the 60s/function Hobby cap.
#
# Required secret on the repo: CRON_SECRET (must match the Vercel env var of
# the same name). Configure at: github.com/tGoh98/css/settings/secrets/actions

on:
  schedule:
    - cron: '*/15 * * * *'   # 15m tick: news + reddit + hn
    - cron: '0 * * * *'      # hourly tick: figma-blog + sec + competitors + chart + cluster
  workflow_dispatch:
    inputs:
      tick:
        description: 'Tick to run (manual override)'
        type: choice
        options:
          - '15m'
          - 'hourly'
        default: '15m'

permissions: {}

concurrency:
  group: cron-${{ github.event.schedule || inputs.tick }}
  cancel-in-progress: false

jobs:
  poke-15m:
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.tick == '15m')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        endpoint: [ingest/news, ingest/reddit, ingest/hn]
    steps:
      - name: Poke ${{ matrix.endpoint }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret not set. Add at repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          URL="https://css-lake-three.vercel.app/api/cron/${{ matrix.endpoint }}"
          echo "Hitting $URL"
          RESPONSE=$(curl -fsS --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$URL")
          echo "$RESPONSE"
          # Fail the step (which fails the workflow → email on failure) if the
          # ingest reported saturation. Resend email is the richer notification;
          # this GH-Actions failure is the catch-all so we never miss a signal
          # even if Resend/notification path is broken.
          WARNINGS=$(echo "$RESPONSE" | jq -r '.warnings // [] | join("\n")')
          if [ -n "$WARNINGS" ]; then
            echo "::error::Ingest saturation in ${{ matrix.endpoint }}:"
            echo "$WARNINGS" | sed 's/^/::error::  /'
            exit 1
          fi

  poke-hourly:
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.tick == 'hourly')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        endpoint: [ingest/figma-blog, ingest/sec, ingest/competitors, ingest/chart, cluster]
    steps:
      - name: Poke ${{ matrix.endpoint }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret not set. Add at repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          URL="https://css-lake-three.vercel.app/api/cron/${{ matrix.endpoint }}"
          echo "Hitting $URL"
          RESPONSE=$(curl -fsS --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$URL")
          echo "$RESPONSE"
          # Fail the step (which fails the workflow → email on failure) if the
          # ingest reported saturation. Resend email is the richer notification;
          # this GH-Actions failure is the catch-all so we never miss a signal
          # even if Resend/notification path is broken.
          WARNINGS=$(echo "$RESPONSE" | jq -r '.warnings // [] | join("\n")')
          if [ -n "$WARNINGS" ]; then
            echo "::error::Ingest saturation in ${{ matrix.endpoint }}:"
            echo "$WARNINGS" | sed 's/^/::error::  /'
            exit 1
          fi

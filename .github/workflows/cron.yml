name: Cron

# Drives the Vercel cron endpoints from GitHub Actions. We use GH Actions
# instead of Vercel Cron because Vercel Hobby caps cron frequency at daily,
# and we split per-source to stay under the 60s/function Hobby cap.
#
# Required secret on the repo: CRON_SECRET (must match the Vercel env var of
# the same name). Configure at: github.com/tGoh98/css/settings/secrets/actions

on:
  schedule:
    - cron: '*/5 * * * *'    # fast tier: news + reddit + hn
    - cron: '0 * * * *'      # slow tier: figma-blog + sec + competitors + chart + cluster
  workflow_dispatch:
    inputs:
      tick:
        description: 'Tick to run (manual override)'
        type: choice
        options:
          - 'fast'
          - 'slow'
        default: 'fast'

permissions: {}

concurrency:
  group: cron-${{ github.event.schedule || inputs.tick }}
  cancel-in-progress: false

jobs:
  poke-fast:
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.tick == 'fast')
    runs-on: ubuntu-latest
    # 8 min, not 5: the curl budget below is ~186 s worst case, and the job
    # needs headroom above it. At timeout-minutes: 5 the old curl budget
    # (4 attempts x --max-time 90 + delays = 366 s) could exceed the job
    # timeout and be killed mid-retry, surfacing as a workflow *failure*
    # rather than the transient blip it actually was.
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        endpoint: [ingest/news, ingest/reddit, ingest/hn]
    steps:
      - name: Poke ${{ matrix.endpoint }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret not set. Add at repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          URL="https://css-lake-three.vercel.app/api/cron/${{ matrix.endpoint }}"
          echo "Hitting $URL"
          # --retry-all-errors + --retry-connrefused so a transient TLS/connection
          # blip to Vercel (curl exit 35 SSL_ERROR_SYSCALL, connection reset, etc.)
          # retries instead of failing the whole workflow and firing a false-alarm
          # email. Plain --retry does NOT cover a connect-phase SSL error, hence the
          # sledgehammer. The ingest pollers are idempotent (watermark + SHA dedup),
          # so a retry is safe even if an earlier attempt reached the server.
          # Budget: 3 attempts x 60 s + 2 x 3 s delay = 186 s worst case, which
          # must stay comfortably under this job's timeout-minutes (see above).
          RESPONSE=$(curl -fsS --max-time 60 --connect-timeout 15 \
            --retry 2 --retry-delay 3 --retry-connrefused --retry-all-errors \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$URL")
          echo "$RESPONSE"
          # Fail the step (which fails the workflow → email on failure) if the
          # ingest reported saturation. Resend email is the richer notification;
          # this GH-Actions failure is the catch-all so we never miss a signal
          # even if Resend/notification path is broken.
          WARNINGS=$(echo "$RESPONSE" | jq -r '.warnings // [] | join("\n")')
          if [ -n "$WARNINGS" ]; then
            echo "::error::Ingest saturation in ${{ matrix.endpoint }}:"
            echo "$WARNINGS" | sed 's/^/::error::  /'
            exit 1
          fi

  poke-slow:
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.tick == 'slow')
    runs-on: ubuntu-latest
    # 8 min, not 5: the curl budget below is ~186 s worst case, and the job
    # needs headroom above it. At timeout-minutes: 5 the old curl budget
    # (4 attempts x --max-time 90 + delays = 366 s) could exceed the job
    # timeout and be killed mid-retry, surfacing as a workflow *failure*
    # rather than the transient blip it actually was.
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        endpoint: [ingest/figma-blog, ingest/sec, ingest/competitors, ingest/chart, cluster]
    steps:
      - name: Poke ${{ matrix.endpoint }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret not set. Add at repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          URL="https://css-lake-three.vercel.app/api/cron/${{ matrix.endpoint }}"
          echo "Hitting $URL"
          # --retry-all-errors + --retry-connrefused so a transient TLS/connection
          # blip to Vercel (curl exit 35 SSL_ERROR_SYSCALL, connection reset, etc.)
          # retries instead of failing the whole workflow and firing a false-alarm
          # email. Plain --retry does NOT cover a connect-phase SSL error, hence the
          # sledgehammer. The ingest pollers are idempotent (watermark + SHA dedup),
          # so a retry is safe even if an earlier attempt reached the server.
          # Budget: 3 attempts x 60 s + 2 x 3 s delay = 186 s worst case, which
          # must stay comfortably under this job's timeout-minutes (see above).
          RESPONSE=$(curl -fsS --max-time 60 --connect-timeout 15 \
            --retry 2 --retry-delay 3 --retry-connrefused --retry-all-errors \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$URL")
          echo "$RESPONSE"
          # Fail the step (which fails the workflow → email on failure) if the
          # ingest reported saturation. Resend email is the richer notification;
          # this GH-Actions failure is the catch-all so we never miss a signal
          # even if Resend/notification path is broken.
          WARNINGS=$(echo "$RESPONSE" | jq -r '.warnings // [] | join("\n")')
          if [ -n "$WARNINGS" ]; then
            echo "::error::Ingest saturation in ${{ matrix.endpoint }}:"
            echo "$WARNINGS" | sed 's/^/::error::  /'
            exit 1
          fi
